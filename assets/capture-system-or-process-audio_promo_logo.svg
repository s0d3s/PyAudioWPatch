<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="140" height="140" viewBox="0 0 140 140" role="img" aria-labelledby="title">
  <title id="title">Swaying neon octopus</title>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-3 0;3 0;-3 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".3642 0 .6358 1;.3642 0 .6358 1" />
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0;0 2;0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".3333 .5236 .6667 1;.3333 0 .6667 .4764;.3333 .5236 .6667 1;.3333 0 .6667 .4764" />
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 70 70;3 70 70;-3 70 70" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".3642 0 .6358 1;.3642 0 .6358 1" />
        <image x="8" y="8" width="124" height="124" xlink:href="data:image/png;base64," />
      </g>
    </g>
  </g>
</svg>